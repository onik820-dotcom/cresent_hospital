# Smartkaj Voice: self-hosted telephony + voice worker on ONE Ubuntu 24.04 VPS.
#
# Everything runs with host networking: SIP/RTP need large UDP port ranges and real source IPs, which
# Docker's port publishing handles badly. Because host networking bypasses Docker's iptables rules,
# the `ufw` firewall from the README is what actually protects the server.
#
#   Caller -> IPTSP -> Asterisk :5060 -> LiveKit SIP 127.0.0.1:5080 -> LiveKit server -> worker -> Gemini
#
# Usage:  cp .env.example .env && nano .env && docker compose up -d --build
x-common: &common
  network_mode: host
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  redis:
    <<: *common
    image: redis:7-alpine
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379", "--protected-mode", "yes", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  livekit-server:
    <<: *common
    image: livekit/livekit-server:latest   # pin to a tested tag once you have one
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis: { condition: service_healthy }

  livekit-sip:
    <<: *common
    image: livekit/sip:latest              # pin to a tested tag once you have one
    environment:
      SIP_CONFIG_FILE: /etc/sip.yaml
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_WS_URL: ws://127.0.0.1:7880
    volumes:
      - ./sip.yaml:/etc/sip.yaml:ro
    depends_on:
      redis: { condition: service_healthy }
      livekit-server: { condition: service_started }

  asterisk:
    <<: *common
    build: ./asterisk
    environment:
      IPTSP_HOST: ${IPTSP_HOST}
      IPTSP_PORT: ${IPTSP_PORT:-5060}
      IPTSP_USER: ${IPTSP_USER}
      IPTSP_PASSWORD: ${IPTSP_PASSWORD}
      IPTSP_ALLOWED_IP: ${IPTSP_ALLOWED_IP:-${IPTSP_HOST}}
      PUBLIC_IP: ${PUBLIC_IP}
      CALLED_NUMBER: ${CALLED_NUMBER:-}
      OUTBOUND_PREFIX: ${OUTBOUND_PREFIX-0}
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show uptime"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      livekit-sip: { condition: service_started }

  caddy:
    <<: *common
    image: caddy:2
    environment:
      VOICE_DOMAIN: ${VOICE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      livekit-server: { condition: service_started }

  worker:
    <<: *common
    build: ../worker
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      AGENT_API_BASE: ${AGENT_API_BASE}
      AGENT_API_KEY: ${AGENT_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-live}
      GEMINI_LANGUAGE: ${GEMINI_LANGUAGE:-}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-gemini-3.5-flash-lite}
      FALLBACK_TRANSFER_NUMBER: ${FALLBACK_TRANSFER_NUMBER:-}
      INBOUND_NUMBERS: ${INBOUND_NUMBERS:-}   # only used by scripts/setup_sip.py
      COST_IN_AUDIO_PER_MTOK: ${COST_IN_AUDIO_PER_MTOK:-3.33}
      COST_OUT_AUDIO_PER_MTOK: ${COST_OUT_AUDIO_PER_MTOK:-12.0}
      COST_IN_TEXT_PER_MTOK: ${COST_IN_TEXT_PER_MTOK:-0.75}
      COST_OUT_TEXT_PER_MTOK: ${COST_OUT_TEXT_PER_MTOK:-4.5}
      TZ: Asia/Dhaka
    depends_on:
      livekit-server: { condition: service_started }

volumes:
  caddy_data:
  caddy_config:
